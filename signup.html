<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up | Computer Service Center</title>
  <meta name="description" content="Computer Service Center: laptop and desktop repair, data recovery, upgrades and networking.">
  <meta name="theme-color" content="#0B2A6B">
  <link rel="icon" type="image/webp" href="./images/logo-mark-navyblue.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
:root{--bg:#F5F8FE;--surf:#fff;--ice:#EAF1FD;--ice2:#DCE8FB;--navy:#0B2A6B;--navy2:#071D4F;--blue:#1D5FE8;--blue2:#1450C9;--sky:#8DB8FF;--ink:#0A1630;--mut:#54627F;--line:#DCE6F7;--amb:#F5A524;--grn:#1FA971;--red:#D64545;--sh:0 1px 2px rgba(11,42,107,.06),0 12px 32px -14px rgba(11,42,107,.20);--shh:0 2px 4px rgba(11,42,107,.06),0 26px 50px -18px rgba(11,42,107,.34);--fd:'Sora','Segoe UI',Arial,sans-serif;--fb:'Figtree','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.02em;line-height:1.15;margin:0;color:var(--navy)}
p{margin:0}
.container{width:min(1180px,92%);margin-inline:auto}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid rgba(29,95,232,.45);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:12px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:transform .25s,background .25s,box-shadow .25s,color .25s,border-color .25s;white-space:nowrap}
.btn:hover{background:var(--navy);border-color:var(--navy);transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(11,42,107,.55)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--ice2)}
.btn.ghost:hover{background:var(--ice);border-color:var(--blue);color:var(--blue)}
.btn.white{background:#fff;color:var(--navy);border-color:#fff}
.btn.white:hover{background:var(--amb);border-color:var(--amb);color:var(--navy2)}
.btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.line:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.sm{padding:9px 16px;font-size:13.5px;border-radius:10px}
.btn .ic{width:18px;height:18px;transition:transform .25s}.btn:hover .ic{transform:translateX(3px)}
.link{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14.5px;color:var(--blue);transition:gap .25s,color .25s}
.link .ic{width:16px;height:16px}.link:hover{gap:9px;color:var(--navy)}
/* header */
.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:box-shadow .3s,border-color .3s}
.site-header.scrolled{border-color:var(--line);box-shadow:0 10px 30px -20px rgba(11,42,107,.4)}
.nav{height:74px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;transition:transform .3s,opacity .3s}.brand:hover{transform:scale(1.04)}
.brand img{height:34px;width:auto}
.navlinks{display:flex;gap:6px;margin-left:auto}
.navlinks a{position:relative;padding:10px 16px;font-weight:600;font-size:15px;color:var(--mut);border-radius:10px;transition:color .25s,background .25s}
.navlinks a:after{content:"";position:absolute;left:16px;right:16px;bottom:5px;height:2px;border-radius:2px;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.navlinks a:hover{color:var(--navy);background:var(--ice)}
.navlinks a:hover:after,.navlinks a.active:after{transform:scaleX(1)}
.navlinks a.active{color:var(--navy)}
.menu-btn{display:none;margin-left:auto;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);align-items:center;justify-content:center;cursor:pointer;transition:background .25s,border-color .25s}
.menu-btn:hover{background:var(--ice);border-color:var(--blue)}
.drawer-overlay{position:fixed;inset:0;background:rgba(7,29,79,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,86%);background:#fff;z-index:80;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:20px;display:flex;flex-direction:column;gap:6px;visibility:hidden}
.drawer.open{transform:none;visibility:visible;box-shadow:-20px 0 50px -20px rgba(7,29,79,.4)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer-top img{height:30px;width:auto}
.drawer a.dl{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;border-radius:12px;font-weight:600;color:var(--navy);transition:background .25s,padding .25s,color .25s}
.drawer a.dl:hover,.drawer a.dl.active{background:var(--ice);padding-left:20px;color:var(--blue)}
.drawer .btn{margin-top:14px}
/* hero */
.hero{position:relative;background:radial-gradient(900px 480px at 85% 0%,#DCE8FB 0%,rgba(220,232,251,0) 70%),linear-gradient(180deg,#F5F8FE,#EEF4FE);padding:56px 0 120px}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(36px,4.8vw,62px);font-weight:700;letter-spacing:-.035em}
.hero .lead{margin-top:20px;font-size:18.5px;color:var(--mut);max-width:540px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-facts{display:flex;gap:34px;margin-top:40px;padding-top:26px;border-top:1px solid var(--line);flex-wrap:wrap}
.fact b{display:block;font-family:var(--fd);font-size:30px;color:var(--navy);letter-spacing:-.03em;line-height:1.1}
.fact span{font-size:13.5px;color:var(--mut)}
.hero-media{position:relative}
.hero-media .frame{border-radius:28px;overflow:hidden;box-shadow:var(--shh);border:6px solid #fff;background:var(--ice)}
.hero-media img{width:100%;height:auto;aspect-ratio:1200/730;object-fit:cover;object-position:center 15%;transition:transform .8s}
.hero-media:hover img{transform:scale(1.04)}
.badge-float{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--shh);font-size:13.5px;line-height:1.3;transition:transform .35s}
.badge-float b{display:block;color:var(--navy);font-size:14.5px}
.badge-float .dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--ice);color:var(--blue)}
.badge-float:hover{transform:translateY(-5px)}
.bf1{left:-26px;top:44px}.bf2{right:-18px;bottom:36px}
.bf2 .dot{background:#FFF1D6;color:#B8770A}
/* load sequence */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hero .seq>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.hero .seq>*:nth-child(1){animation-delay:.05s}.hero .seq>*:nth-child(2){animation-delay:.15s}.hero .seq>*:nth-child(3){animation-delay:.25s}.hero .seq>*:nth-child(4){animation-delay:.35s}
.hero-media{animation:rise 1s .2s cubic-bezier(.2,.8,.2,1) both}
/* tracker */
.tracker-wrap{margin-top:-74px;position:relative;z-index:5}
.tracker{background:#fff;border-radius:24px;box-shadow:var(--shh);padding:28px 32px;border:1px solid var(--line)}
.tracker-row{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.tracker h2{font-size:21px}.tracker p.sub{font-size:14px;color:var(--mut);margin-top:2px}
.input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:0;transition:border-color .25s,box-shadow .25s,background .25s}
.input:hover{border-color:var(--sky)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(29,95,232,.12)}
textarea.input{resize:vertical;min-height:130px}
.tmsg{font-size:14px;margin-top:14px;font-weight:600}.tmsg:empty{display:none}
.tmsg.ok{color:var(--grn)}.tmsg.bad{color:var(--red)}
.steps-line{display:none;grid-template-columns:repeat(5,1fr);margin-top:22px;position:relative}
.steps-line.show{display:grid}
.sl{position:relative;text-align:center;font-size:13.5px;font-weight:600;color:var(--mut);padding-top:26px;transition:color .3s}
.sl:before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--ice2)}
.sl:first-child:before{left:50%}.sl:last-child:before{right:50%}
.sl:after{content:"";position:absolute;top:0;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--ice2);transition:all .3s}
.sl.done{color:var(--navy)}.sl.done:before{background:var(--blue)}.sl.done:after{background:var(--blue);border-color:var(--blue)}
.sl.now:after{box-shadow:0 0 0 6px rgba(29,95,232,.18);background:#fff;border-color:var(--blue)}
.sl.now:before{background:linear-gradient(90deg,var(--blue),var(--ice2))}
/* sections */
.section{padding:56px 0}.section.tight{padding:34px 0}.section.alt{background:#fff;border-block:1px solid var(--line)}
.head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:44px}
.head h2{font-size:clamp(28px,3.4vw,42px);font-weight:700}
.head p{color:var(--mut);max-width:460px;font-size:16.5px}
.grid{display:grid;gap:22px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--sky));transform:scaleX(0);transform-origin:left;transition:transform .4s}
.card:hover{transform:translateY(-8px);box-shadow:var(--shh);border-color:var(--sky)}
.card:hover:before{transform:scaleX(1)}
.card h3{font-size:19px;margin:20px 0 8px}
.card p{color:var(--mut);font-size:15px}
.card .link{margin-top:18px}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--ice);color:var(--blue);transition:background .3s,color .3s,transform .4s}
.ico .ic{width:26px;height:26px}
.card:hover .ico{background:var(--blue);color:#fff;transform:rotate(-6deg) scale(1.06)}
.tick{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-top:6px}.tick .ic{width:16px;height:16px;color:var(--grn)}
/* service thumbs, stats, brands */
.card.svc{padding-top:0}.card.svc .thumb{margin:0 -28px 22px;aspect-ratio:1000/640;overflow:hidden;background:var(--ice)}
.card.svc .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card.svc:hover .thumb img{transform:scale(1.08)}.card.svc h3{margin-top:16px}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.st{padding:28px;border-right:1px solid var(--line);transition:background .3s}.st:last-child{border:0}.st:hover{background:var(--ice)}
.st b{display:block;font-family:var(--fd);font-size:30px;color:var(--navy);letter-spacing:-.03em}.st span{color:var(--mut);font-size:14px}
.brands{display:flex;flex-wrap:wrap;gap:14px}.brands span{flex:1 1 120px;text-align:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-family:var(--fd);font-weight:700;color:var(--mut);transition:color .3s,border-color .3s,transform .3s,box-shadow .3s}
.brands span:hover{color:var(--blue);border-color:var(--sky);transform:translateY(-4px);box-shadow:var(--sh)}
/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.rev .media{order:2}
.media{position:relative;border-radius:26px;overflow:hidden;background:var(--ice);box-shadow:var(--shh);border:6px solid #fff}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.media:hover img{transform:scale(1.06)}
.media.tall img{aspect-ratio:1200/857}
.split h2{font-size:clamp(28px,3.2vw,40px);margin-bottom:16px}
.split p.lead{color:var(--mut);font-size:17px}
.feats{display:grid;gap:6px;margin-top:24px}
.feat{display:flex;gap:16px;padding:14px 16px;border-radius:16px;border:1px solid transparent;transition:background .3s,border-color .3s,transform .3s}
.feat:hover{background:#fff;border-color:var(--line);transform:translateX(8px);box-shadow:var(--sh)}
.feat .ck{width:38px;height:38px;border-radius:12px;background:#E3F6EE;color:var(--grn);display:grid;place-items:center;flex:none;transition:background .3s,color .3s}
.feat:hover .ck{background:var(--grn);color:#fff}
.feat b{display:block;color:var(--navy);font-family:var(--fd);font-size:16px}.feat span{color:var(--mut);font-size:14.5px}
/* steps */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative}
.proc:before{content:"";position:absolute;top:30px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,var(--sky) 0 8px,transparent 8px 16px)}
.pstep{position:relative;text-align:center;padding:0 12px;transition:transform .35s}
.pstep:hover{transform:translateY(-6px)}
.pnum{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;background:#fff;border:2px solid var(--sky);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:20px;color:var(--navy);position:relative;transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.pstep:hover .pnum{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 12px 24px -10px rgba(29,95,232,.7)}
.pstep h3{font-size:18px;margin-bottom:6px}.pstep p{color:var(--mut);font-size:15px}
/* testimonials */
.quote .stars{display:flex;gap:2px;color:var(--amb)}.quote .stars .ic{width:18px;height:18px}
.quote p.q{font-size:16.5px;color:var(--ink);margin:16px 0 22px}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:700;transition:background .3s,transform .3s}
.card:hover .av{background:var(--blue);transform:scale(1.08)}
.who b{display:block;color:var(--navy);font-size:15px}.who span{font-size:13.5px;color:var(--mut)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:16px}
.gallery .media{border-width:4px;border-radius:22px}.gallery .media:first-child{grid-column:span 2;grid-row:span 2}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 16px;background:linear-gradient(0deg,rgba(7,29,79,.82),transparent);color:#fff;font-weight:700;font-size:15px;transform:translateY(100%);transition:transform .4s}
.gallery .media:hover figcaption{transform:none}
.gallery figure{margin:0}
/* cta */
.cta{position:relative;overflow:hidden;border-radius:30px;padding:64px;background:linear-gradient(120deg,#0B2A6B,#154AC0);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:34px}
.cta:before,.cta:after{content:"";position:absolute;border-radius:50%;background:rgba(141,184,255,.18);pointer-events:none}
.cta:before{width:380px;height:380px;right:-90px;top:-170px}.cta:after{width:240px;height:240px;right:200px;bottom:-150px}
.cta h2{color:#fff;font-size:clamp(26px,3.2vw,38px);max-width:600px}.cta p{color:#C9D9F7;margin-top:12px;max-width:560px}
.cta .actions{margin:0;position:relative;z-index:1}
/* inner hero */
.phero{background:radial-gradient(800px 380px at 90% 0%,#DCE8FB,rgba(220,232,251,0) 70%),linear-gradient(180deg,#F5F8FE,#EEF4FE);padding:50px 0 70px;border-bottom:1px solid var(--line)}
.phero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-bottom:18px}
.crumbs a{transition:color .25s}.crumbs a:hover{color:var(--blue)}.crumbs .ic{width:14px;height:14px}
.phero h1{font-size:clamp(34px,4.4vw,54px);letter-spacing:-.03em}
.phero p.lead{margin-top:16px;color:var(--mut);font-size:18px;max-width:560px}
.phero .media{border-width:5px;max-height:340px}.phero .media img{aspect-ratio:1200/760}
/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.chip{padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;color:var(--mut);cursor:pointer;transition:all .25s}
.chip:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hide{display:none!important}
/* faq */
.faq{display:grid;gap:12px;max-width:860px;margin-inline:auto}
.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;transition:border-color .3s,box-shadow .3s}
.faq details:hover{border-color:var(--sky);box-shadow:var(--sh)}
.faq summary{list-style:none;cursor:pointer;padding:20px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center;font-family:var(--fd);font-weight:600;color:var(--navy);font-size:16.5px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .3s;color:var(--blue)}.faq details[open] summary .ic{transform:rotate(45deg)}
.faq details p{padding:0 24px 22px;color:var(--mut)}
/* forms */
.group{margin-bottom:16px}.group label{display:block;font-weight:700;font-size:14px;color:var(--navy);margin-bottom:7px}
.err{display:block;color:var(--red);font-size:13px;min-height:18px;margin-top:5px}
.okmsg{color:var(--grn);font-weight:600;font-size:14.5px;margin-top:12px}
.formcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--sh)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* contact cards link */
a.card{display:block}
/* team */
.team .media{border-radius:0;border:0;box-shadow:none;margin:-28px -28px 22px;aspect-ratio:1/1}
.team .media img{aspect-ratio:1/1}
.role{color:var(--blue);font-weight:700;font-size:14px}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:13px;color:var(--mut);text-align:left;font-weight:700;background:#F3F7FE;padding:14px 18px;white-space:nowrap}
td{padding:15px 18px;border-top:1px solid var(--line);font-size:14.5px;white-space:nowrap}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--ice)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.p-blue{background:#E4EDFD;color:#1450C9}.p-amb{background:#FFF1D6;color:#9A6206}.p-grn{background:#DDF4EA;color:#12794F}.p-navy{background:#DCE3F4;color:#0B2A6B}.p-red{background:#FBE3E3;color:#B03030}
/* footer */
.site-footer{background:var(--navy2);color:#B9C8E6;margin-top:0;position:relative;overflow:hidden}
.site-footer:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(29,95,232,.16);right:-180px;top:-260px;pointer-events:none}
.foot{display:grid;grid-template-columns:1.5fr 1fr 1.1fr 1.3fr;gap:44px;padding:72px 0 48px;position:relative}
.foot img.flogo{height:38px;width:auto;margin-bottom:20px;transition:transform .3s}.foot img.flogo:hover{transform:scale(1.05)}
.foot p{font-size:14.5px;line-height:1.7;max-width:330px}
.foot h4{color:#fff;font-size:16px;margin-bottom:18px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}

body{background:#fff}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

.auth-left:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,29,79,.92) 0%,rgba(7,29,79,.55) 34%,rgba(7,29,79,0) 62%)}
.auth-copy{position:absolute;z-index:2;left:48px;right:48px;bottom:52px;color:#fff}

</head>

<body>

  <!-- ==========================================================
       ICON SPRITE
       Use an icon anywhere with:
         <svg class="ic" aria-hidden="true"><use href="#i-NAME"/></svg>
       ========================================================== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
  </svg>


  <!-- ==========================================================
       SIGN UP PAGE (two columns: image left, form right)
       ========================================================== -->
  <div class="auth">

    <!-- Left: background image + tagline -->
    <div class="auth-left">
      <img class="bg" src="./images/photos/1727434032773-af3cd98375ba.jpg" alt="" width="1200" height="1400">
      <div class="auth-copy">
        <h2>Set up your service workspace.</h2>
        <p>Create an account to manage repairs, customers and service updates.</p>
      </div>
    </div>

    <!-- Right: form -->
    <div class="auth-right">
      <div class="auth-box">

        <!-- Top row: logo (left) + Go home (right) -->
        <div class="auth-top">
          <a href="index.html">
            <img class="auth-logo" src="./images/logo-navyblue.webp" alt="Stackly logo" width="95" height="36">
          </a>
          <a class="back" href="index.html">
            <svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg>
            Go home
          </a>
        </div>

        <!-- Login / Sign up tabs -->
        <div class="tabs">
          <a href="login.html">Login</a>
          <a class="active" href="signup.html">Sign up</a>
        </div>

        <h1>Join Computer Service Center.</h1>
        <p class="sub">Create your account to open your service workspace.</p>

        <!-- Role selector (Administrator is selected by default) -->
        <div class="roles" role="radiogroup" aria-label="Choose role">
          <button type="button" class="rolebtn selected" data-role="Administrator" role="radio" aria-checked="true">
            <b>Administrator</b>
            <small>Manage services, repairs, technicians and reports.</small>
          </button>

          <button type="button" class="rolebtn" data-role="Technician" role="radio" aria-checked="false">
            <b>Technician</b>
            <small>Manage assigned repairs and service status.</small>
          </button>
        </div>

        <!-- Sign up form -->
        <form id="af" novalidate>

          <div class="group">
            <label for="name">Full name</label>
            <input id="name" class="input" autocomplete="name">
            <span id="nameErr" class="err"></span>
          </div>

          <div class="group">
            <label for="email">Email</label>
            <input id="email" class="input" type="email" autocomplete="email">
            <span id="emailErr" class="err"></span>
          </div>

          <div class="row2">

            <div class="group">
              <label for="password">Password</label>
              <div class="pw">
                <input id="password" class="input" type="password" autocomplete="new-password">
                <button type="button" aria-label="Show or hide password">
                  <svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg>
                </button>
              </div>
              <span id="passErr" class="err"></span>
            </div>

            <div class="group">
              <label for="confirm">Confirm password</label>
              <div class="pw">
                <input id="confirm" class="input" type="password" autocomplete="new-password">
                <button type="button" aria-label="Show or hide password">
                  <svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg>
                </button>
              </div>
              <span id="confirmErr" class="err"></span>
            </div>

          </div>

          <div class="check">
            <label>
              <input id="terms" type="checkbox"> I agree to the Terms &amp; Conditions
            </label>
          </div>

          <button class="btn" style="width:100%" type="submit">Create account
            <svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg>
          </button>

          <div id="msg" class="fmsg" role="status"></div>

        </form>

        <!-- Social sign-in (links are placeholders) -->
        <div class="divider">or continue with</div>
        <div class="sos">
          <a href="404.html" aria-label="Google">Google</a>
          <a href="404.html" aria-label="Facebook">Facebook</a>
          <a href="404.html" aria-label="X">X</a>
        </div>

      </div>
    </div>

  </div>


  <!-- ==========================================================
       JAVASCRIPT
       1. Role selection
       2. Show / hide password
       3. Form validation and saving the new user
       ========================================================== -->
  <script>
    /* Helpers ------------------------------------------------------- */
    function $(id) {
      return document.getElementById(id);
    }

    // Email must end in .com, .in or .org
    var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.(com|in|org)$/i;

    // Read all saved users from localStorage (returns {} if none or invalid)
    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem('cscUsers') || '{}');
      } catch (e) {
        return {};
      }
    }


    /* 1. Role selection --------------------------------------------- */
    var role = 'Administrator';

    document.querySelectorAll('.rolebtn').forEach(function (btn) {
      btn.addEventListener('click', function () {

        // Clear the previous selection
        document.querySelectorAll('.rolebtn').forEach(function (other) {
          other.classList.remove('selected');
          other.setAttribute('aria-checked', 'false');
        });

        // Select the clicked role
        btn.classList.add('selected');
        btn.setAttribute('aria-checked', 'true');
        role = btn.dataset.role;
      });
    });


    /* 2. Show / hide password --------------------------------------- */
    document.querySelectorAll('.pw button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = btn.parentNode.querySelector('input');
        input.type = (input.type === 'password') ? 'text' : 'password';
      });
    });


    /* 3. Form validation and saving --------------------------------- */
    $('af').addEventListener('submit', function (e) {
      e.preventDefault();

      var isValid = true;

      var name     = $('name').value.trim();
      var email    = $('email').value.trim();
      var password = $('password').value;
      var confirm  = $('confirm').value;
      var msg      = $('msg');

      // Field checks (each shows its own error message, or clears it)
      $('nameErr').textContent    = /^[A-Za-z ]+$/.test(name)
        ? '' : 'Name must contain alphabets and spaces only.';

      $('emailErr').textContent   = EMAIL_PATTERN.test(email)
        ? '' : 'Enter a valid .com, .in or .org email.';

      $('passErr').textContent    = (password.length >= 6)
        ? '' : 'Password must be at least 6 characters.';

      $('confirmErr').textContent = (confirm === password && confirm)
        ? '' : 'Passwords do not match.';

      // Reset the general message
      msg.textContent = '';
      msg.className = 'fmsg';

      // Terms checkbox
      if (!$('terms').checked) {
        msg.className = 'fmsg bad';
        msg.textContent = 'Please accept the Terms & Conditions.';
        isValid = false;
      }

      // Any field error?
      if ($('nameErr').textContent ||
          $('emailErr').textContent ||
          $('passErr').textContent ||
          $('confirmErr').textContent) {
        isValid = false;
      }

      if (!isValid) return;

      // Save the new user, keyed by lowercase email
      var users = getUsers();
      users[email.toLowerCase()] = { name: name, role: role };
      localStorage.setItem('cscUsers', JSON.stringify(users));

      // Success message, then go to the login page
      msg.className = 'fmsg ok';
      msg.textContent = 'Account created. Redirecting to login...';
      setTimeout(function () {
        location.href = 'login.html';
      }, 800);
    });
  </script>

</body>
</html>
